# Keeps the Geographies map's GDP figures current.
#
# Once a day this asks the IMF for the latest World Economic Outlook estimates
# and, only if a number or the release name changed, commits the refreshed
# site/src/data/gdp.json to the 11.0 branch. That push is what makes Vercel
# rebuild, so the live map updates within minutes of the commit. A day with no
# change makes no commit and no deploy.
#
# If the IMF API is unreachable the script exits non-zero without touching the
# file: this run shows as failed (GitHub emails the repo owner), the site keeps
# its last good numbers, and tomorrow's run tries again. The "Run workflow"
# button on the Actions tab triggers it on demand, e.g. the day a new WEO is out.
#
# Note: GitHub only fires `schedule` from the repository's default branch, so a
# copy of this file must live there for the daily run to happen.

name: Update GDP figures

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "11.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the latest WEO estimates
        run: node site/scripts/update-gdp.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- site/src/data/gdp.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/gdp.json
          git commit -m "Refresh the map's GDP figures from the IMF WEO"
          git push origin HEAD:11.0
