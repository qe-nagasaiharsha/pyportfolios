# Isolated nginx instance for the pyportfolios static export on :8080 (public).
# Port 8080 is commonly allowed outbound by corporate firewalls (fallback from :8000).
# Paths point at THIS clone (Administrator/Desktop/Yonishwari/download). Runs alongside any other nginx.
# Start:  C:\nginx-1.28.3\nginx.exe -p C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/ -c C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-8080.conf
# Stop:   ...same... -s stop     Reload: ...same... -s reload
worker_processes  1;
error_log  C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/logs/error.log warn;
pid        C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx-1.28.3/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    access_log            C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/logs/access.log;
    client_body_temp_path C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/temp/client;
    proxy_temp_path       C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/temp/proxy;
    fastcgi_temp_path     C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/temp/fastcgi;
    uwsgi_temp_path       C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/temp/uwsgi;
    scgi_temp_path        C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/deploy/nginx-runtime-8080/temp/scgi;

    server {
        # Bound on all interfaces so the site is reachable at http://<server-ip>:8080
        listen       8080;
        server_name  _;

        root  C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/site/out;
        index index.html;

        location / {
            try_files $uri $uri.html $uri/ /index.html;
            # Always revalidate HTML/images so updates show immediately (no stale cache)
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Platform API (auth / subscriptions / payments / gated content).
        # FastAPI sidecar, run from platform\:  uvicorn app.main:app --port 8799
        # (8787 is taken by an unrelated process on this box - see platform/README.md)
        # The app's routes already carry the /api prefix, so no rewrite here.
        location /api/ {
            proxy_pass         http://127.0.0.1:8799;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # auth cookies must pass through untouched
            proxy_pass_header  Set-Cookie;
            add_header Cache-Control "no-store";
        }

        location /_next/static/ {
            # Fingerprinted assets - safe to cache forever
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Portable single-file version, also reachable at /standalone.html
        location = /standalone.html {
            alias C:/Users/Administrator/Desktop/Yonishwari/download/pyportfolios/pyportfolios.html;
        }

        error_page 404 /404.html;
    }
}
