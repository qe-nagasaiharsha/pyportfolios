# ============================================================================
# Shared server body for every pyportfolios nginx config.
#
# Included from inside a `server { ... }` block. Every path here is RELATIVE
# and is resolved by nginx against its prefix (the -p flag), which is always
# <repo>/deploy/nginx-runtime-<port>/. That is what makes these configs work
# from any clone on any machine — no absolute paths, nothing to edit after
# a git pull. Previously each config hardcoded ~12 absolute paths and five of
# seven pointed at a different developer's clone.
#
#   ../../site/out          -> <repo>/site/out
#   ../../pyportfolios.html -> <repo>/pyportfolios.html
#
# Careful: `include` directives resolve against the CONFIG FILE's directory
# (deploy/), but root/alias/logs/temp resolve against the -p PREFIX. Two
# different bases — that asymmetry is nginx's, not a mistake here.
#
# Edit the routing ONCE here; all ports inherit it (this is why the /api
# proxy previously existed on :8080 only, silently breaking auth, checkout
# and downloads on every other port).
# ============================================================================

root  ../../site/out;
index index.html;

location / {
    try_files $uri $uri.html $uri/ /index.html;
    # Always revalidate HTML so updates show immediately (no stale cache)
    add_header Cache-Control "no-cache, must-revalidate";
}

# Platform API — auth / subscriptions / payments / gated content.
# FastAPI sidecar, run from platform\:  uvicorn app.main:app --port 8799
# (see deploy/run-sidecar.ps1). Routes already carry /api, so no rewrite.
location /api/ {
    proxy_pass         http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # auth cookies must pass through untouched
    proxy_pass_header  Set-Cookie;
    add_header Cache-Control "no-store";
}

# Product / data extensions must never come from the static site — notebooks
# and bundles are paid content in vault/, served via /api/content/*. Without
# this, try_files falls back to index.html and returns a soft 200 for e.g.
# the retired /notebooks/*.ipynb links, which reads as "alive" to crawlers.
location ~* \.(ipynb|zip|csv)$ {
    return 404;
}

location /_next/static/ {
    # Fingerprinted assets — safe to cache forever
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Portable single-file version, also reachable at /standalone.html
location = /standalone.html {
    alias ../../pyportfolios.html;
}

error_page 404 /404.html;
