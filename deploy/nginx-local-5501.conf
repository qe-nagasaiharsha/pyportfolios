# Isolated nginx instance for the standalone CONTENT HUB on :5501.
# Serves only the /content page (at the root), separate from the main site on :5500.
# Start:  C:\nginx-1.28.3\nginx.exe -p C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/ -c C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-local-5501.conf
# Stop:   ...same... -s stop     Reload: ...same... -s reload
worker_processes  1;
error_log  C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/logs/error.log warn;
pid        C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx-1.28.3/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    access_log            C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/logs/access.log;
    client_body_temp_path C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/temp/client;
    proxy_temp_path       C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/temp/proxy;
    fastcgi_temp_path     C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/temp/fastcgi;
    uwsgi_temp_path       C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/temp/uwsgi;
    scgi_temp_path        C:/Users/Yonishwari/Desktop/Projects/pyportfolios/deploy/nginx-runtime-5501/temp/scgi;

    server {
        listen       5501;
        server_name  localhost;

        root  C:/Users/Yonishwari/Desktop/Projects/pyportfolios/site/out;

        # The content hub is the root of this port.
        location = / {
            try_files /content.html =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Fingerprinted build assets — needed by the page.
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Everything else: serve real static files (fonts, images, _next),
        # otherwise fall back to the hub — so the rest of the main site is not
        # browsable from this port.
        location / {
            try_files $uri /content.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        error_page 404 /content.html;
    }
}
