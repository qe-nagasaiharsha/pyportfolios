# Isolated nginx instance for the pyportfolios static export on :8081 (named instance).
#
# Machine-independent: every path below is relative to nginx's prefix, which is
# passed with -p and must be <repo>/deploy/nginx-runtime-8081/.
# Routing (including the /api proxy) is shared — see deploy/nginx-common.conf.
#
# Start:   powershell -File deploy/run-nginx.ps1 -Port 8081
# Or:      nginx.exe -p <repo>/deploy/nginx-runtime-8081/ -c <repo>/deploy/nginx-pyportfolios.conf
# Stop:    ...same... -s stop      Reload: ...same... -s reload
#
# GENERATED by quant/gen_nginx_configs.py — edit that or nginx-common.conf.
worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # NOTE: `include` resolves relative to THIS FILE's directory (deploy/),
    # while root/alias/logs/temp resolve relative to nginx's -p prefix
    # (deploy/nginx-runtime-8081/). Two different bases - do not "fix" one
    # to match the other.
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    access_log            logs/access.log;
    client_body_temp_path temp/client;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    server {
        # Bound on all interfaces so the site is reachable at http://<host>:8081
        listen       8081;
        server_name  _;

        include nginx-common.conf;
    }
}
