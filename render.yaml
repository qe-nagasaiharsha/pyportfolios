# Render Blueprint — backend (FastAPI) + managed Postgres.
# Deploy: Render dashboard → New → Blueprint → pick this repo. Render reads this
# file, creates the web service + database, and wires DATABASE_URL automatically.
# The Stripe secrets are marked sync:false — you paste them in the dashboard so
# they never live in git.

services:
  - type: web
    name: pyportfolios-api
    runtime: python
    rootDir: platform
    plan: free            # cold-starts after ~15 min idle; bump to "starter" for the review week
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: pyportfolios-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true          # Render generates a strong secret
      - key: COOKIE_SECURE
        value: "true"                # HTTPS in production
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: PUBLIC_BASE_URL
        value: https://pyportfolios.com
      # Secrets — set these in the Render dashboard (not stored in git):
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PREMIUM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PREMIUM_ANNUAL
        sync: false

databases:
  - name: pyportfolios-db
    plan: free            # free Postgres expires after 90 days — fine for a review
